<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <title>Library Focus Mode - Sonu Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #10B981; --bg-dark: #0F172A; --card-dark: #1E293B; --text-light: #F8FAFC; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; text-align: center; }
        
        .header { position: absolute; top: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #94A3B8; text-decoration: none; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-btn:hover { color: white; }

        .focus-container { background: var(--card-dark); padding: 40px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 90%; max-width: 400px; border: 2px solid #334155; }
        
        h2 { color: var(--primary); margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #94A3B8; font-size: 14px; margin-bottom: 30px; }

        .timer-display { font-size: 70px; font-weight: 900; color: white; text-shadow: 0 0 20px rgba(16, 185, 129, 0.4); margin: 20px 0; font-variant-numeric: tabular-nums; letter-spacing: 5px; }

        .time-options { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .time-btn { background: transparent; border: 2px solid #475569; color: #CBD5E1; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .time-btn:hover, .time-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

        .action-btns { display: flex; justify-content: center; gap: 15px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3); transition: 0.3s; }
        .btn-main:hover { transform: scale(1.05); }
        .btn-reset { background: #334155; color: white; border: none; padding: 15px; border-radius: 50%; width: 55px; height: 55px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-reset:hover { background: #EF4444; }

        .quote { margin-top: 30px; font-style: italic; color: #64748B; font-size: 13px; padding: 0 20px; }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
    <div style="color:var(--primary); font-weight:bold;"><i class="fa-solid fa-book-reader"></i> Do Not Disturb</div>
</div>

<div class="focus-container">
    <h2>Library Mode</h2>
    <p>अपना फोन साइड में रखें और पढ़ाई पर फोकस करें!</p>

    <div class="time-options">
        <button class="time-btn" onclick="setTime(25)" id="btn-25">25 Min</button>
        <button class="time-btn active" onclick="setTime(45)" id="btn-45">45 Min</button>
        <button class="time-btn" onclick="setTime(60)" id="btn-60">60 Min</button>
    </div>

    <div class="timer-display" id="timer">45:00</div>

    <div class="action-btns">
        <button class="btn-main" id="startStopBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i> Start</button>
        <button class="btn-reset" onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
    
    <div class="quote" id="quoteText">"सफलता उन्हीं को मिलती है, जो अपने समय की कद्र करते हैं।"</div>
</div>

<script>
    let timeLeft = 45 * 60; 
    let timerId = null;
    let isRunning = false;
    let currentMode = 45;

    const timerDisplay = document.getElementById('timer');
    const startStopBtn = document.getElementById('startStopBtn');
    
    const quotes = [
        "सपने सच करने के लिए नींद गंवानी पड़ती है।",
        "जो आज पढ़ाई का दर्द सहेगा, वो कल दुनिया पर राज करेगा।",
        "UPSC का रास्ता लाइब्रेरी से ही होकर गुज़रता है।",
        "खुद पर विश्वास रखो, तुम कुछ भी कर सकते हो!"
    ];

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function setTime(minutes) {
        if(isRunning) return alert("❌ पहले टाइमर रोकें!");
        
        currentMode = minutes;
        timeLeft = minutes * 60;
        updateDisplay();
        
        document.getElementById('btn-25').classList.remove('active');
        document.getElementById('btn-45').classList.remove('active');
        document.getElementById('btn-60').classList.remove('active');
        document.getElementById(`btn-${minutes}`).classList.add('active');
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timerId);
            startStopBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
            startStopBtn.style.background = 'var(--primary)';
        } else {
            document.getElementById('quoteText').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
            
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    alert("🎉 शानदार! आपका फोकस सेशन पूरा हुआ। अब थोड़ा आराम करें!");
                    resetTimer();
                }
            }, 1000);
            startStopBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
            startStopBtn.style.background = '#F59E0B'; 
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timerId);
        isRunning = false;
        timeLeft = currentMode * 60;
        updateDisplay();
        startStopBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
        startStopBtn.style.background = 'var(--primary)';
    }

    updateDisplay();
</script>

</body>
</html>
