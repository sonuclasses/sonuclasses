<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu Classes - खुफिया एडमिन पैनल</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        
        /* लॉगिन स्क्रीन का डिज़ाइन */
        .login-container { max-width: 350px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-container h2 { color: #D32F2F; margin-bottom: 20px; }
        .login-container input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .login-container button { width: 100%; padding: 12px; background-color: #D32F2F; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        /* एडमिन पैनल का डिज़ाइन (शुरुआत में छुपा रहेगा) */
        .admin-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: none; text-align: left; }
        h2.admin-title { color: #1976D2; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 12px; background-color: #1976D2; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.action-btn:hover { background-color: #1565C0; }
        .section-title { background-color: #4CAF50; color: white; padding: 10px; border-radius: 5px; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

<div class="login-container" id="login-screen">
    <h2>🔒 Admin Login</h2>
    <p style="color: gray; font-size: 14px; margin-bottom: 20px;">सिर्फ सोनू सर के लिए</p>
    <input type="password" id="admin-pass" placeholder="पासवर्ड डालें...">
    <button onclick="checkPassword()">अंदर जाएँ 🚀</button>
</div>

<div class="admin-container" id="admin-panel">
    <h2 class="admin-title">👑 स्वागत है सोनू बॉस!</h2>
    <p style="text-align: center; color: green; font-weight: bold;">वेबसाइट का कंट्रोल रूम चालू है</p>
    
    <div class="form-group">
        <label>क्लास चुनें:</label>
        <select id="class-select">
            <option value="class6">Class 6</option>
            <option value="class7">Class 7</option>
            <option value="class8">Class 8</option>
            <option value="class9">Class 9</option>
            <option value="class10">Class 10</option>
        </select>
    </div>
    <div class="form-group">
        <label>विषय चुनें:</label>
        <select id="subject-select">
            <option value="hindi">Hindi</option>
            <option value="math">Math</option>
            <option value="science">Science</option>
            <option value="sst">SST</option>
            <option value="english">English</option>
        </select>
    </div>
    <div class="form-group">
        <label>पाठ (Lesson) नंबर:</label>
        <select id="lesson-select">
            <option value="lesson1">Lesson 1</option>
            <option value="lesson2">Lesson 2</option>
            <option value="lesson3">Lesson 3</option>
            <option value="lesson4">Lesson 4</option>
            <option value="lesson5">Lesson 5</option>
        </select>
    </div>

    <h3 class="section-title">📝 1. नोट्स और PDF अपलोड करें</h3>
    <div class="form-group">
        <label>नोट्स (VVI Text):</label>
        <textarea id="notes-text" rows="5" placeholder="यहाँ नोट्स पेस्ट करें..."></textarea>
    </div>
    <div class="form-group">
        <label>PDF लिंक (Google Drive):</label>
        <input type="text" id="pdf-link" placeholder="यहाँ PDF का लिंक डालें...">
    </div>
    <button class="action-btn" onclick="saveNotes()">💾 वेबसाइट पर नोट्स सेव करें</button>

    <h3 class="section-title">🏆 2. क्विज़ (Quiz) का सवाल डालें</h3>
    <div class="form-group">
        <label>सवाल (Question):</label>
        <input type="text" id="quiz-question" placeholder="सवाल टाइप करें...">
    </div>
    <div class="form-group">
        <label>Option A:</label>
        <input type="text" id="quiz-optA" placeholder="ऑप्शन A">
    </div>
    <div class="form-group">
        <label>Option B:</label>
        <input type="text" id="quiz-optB" placeholder="ऑप्शन B">
    </div>
    <div class="form-group">
        <label>Option C:</label>
        <input type="text" id="quiz-optC" placeholder="ऑप्शन C">
    </div>
    <div class="form-group">
        <label>Option D:</label>
        <input type="text" id="quiz-optD" placeholder="ऑप्शन D">
    </div>
    <div class="form-group">
        <label>सही जवाब चुनें:</label>
        <select id="quiz-correct">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
    </div>
    <button class="action-btn" style="background-color: #E65100;" onclick="saveQuiz()">➕ क्विज़ में सवाल जोड़ें (Push)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCzAhpQonWiNDtWmyox5QdPd4xRbpOy30",
        authDomain: "sonuclasses-b19db.firebaseapp.com",
        databaseURL: "https://sonuclasses-b19db-default-rtdb.firebaseio.com",
        projectId: "sonuclasses-b19db",
        storageBucket: "sonuclasses-b19db.firebasestorage.app",
        messagingSenderId: "166740602272",
        appId: "1:166740602272:web:af9131ad8c5e4c8fca08c5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 🔒 पासवर्ड चेक करने वाला कोड
    window.checkPassword = () => {
        const pass = document.getElementById('admin-pass').value;
        // 👇 यहाँ आप अपना पासवर्ड बदल सकते हैं, अभी मैंने sonu123 रखा है
        if(pass === "sonu123") { 
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            alert("❌ गलत पासवर्ड! आप सोनू सर नहीं हैं!");
        }
    };

    // Notes Save Function 
    window.saveNotes = () => {
        const cls = document.getElementById('class-select').value;
        const sub = document.getElementById('subject-select').value;
        const les = document.getElementById('lesson-select').value;
        
        const text = document.getElementById('notes-text').value;
        const pdf = document.getElementById('pdf-link').value;

        if (text) set(ref(db, `appData/chapters/${cls}/${sub}/${les}`), text);
        if (pdf) set(ref(db, `appData/notes/${cls}/${sub}/${les}`), pdf);
        
        alert("✅ नोट्स और PDF सक्सेसफुली सेव हो गए!");
        document.getElementById('notes-text').value = '';
        document.getElementById('pdf-link').value = '';
    };

    // Quiz Save Function (Push)
    window.saveQuiz = () => {
        const cls = document.getElementById('class-select').value;
        const sub = document.getElementById('subject-select').value;
        const les = document.getElementById('lesson-select').value;

        const question = document.getElementById('quiz-question').value;
        const optA = document.getElementById('quiz-optA').value;
        const optB = document.getElementById('quiz-optB').value;
        const optC = document.getElementById('quiz-optC').value;
        const optD = document.getElementById('quiz-optD').value;
        const correctAns = document.getElementById('quiz-correct').value;

        if(!question || !optA || !optB || !optC || !optD) {
            alert("⚠️ बॉस, पहले सवाल और सारे ऑप्शन भर दीजिए!");
            return;
        }

        const quizRef = ref(db, `appData/quizzes/${cls}/${sub}/${les}`);
        
        push(quizRef, {
            question: question,
            options: { A: optA, B: optB, C: optC, D: optD },
            answer: correctAns
        }).then(() => {
            alert("✅ बॉस! सवाल सक्सेसफुली जुड़ गया!");
            document.getElementById('quiz-question').value = '';
            document.getElementById('quiz-optA').value = '';
            document.getElementById('quiz-optB').value = '';
            document.getElementById('quiz-optC').value = '';
            document.getElementById('quiz-optD').value = '';
        }).catch((error) => alert("❌ एरर आ गया: " + error));
    };
</script>
</body>
</html>
