<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 - Sonu Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #1E40AF; --highlight-orange: #F97316; --bg-light: #F8FAFC; --card-bg: #FFFFFF; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-light); margin: 0; padding: 0; }
        header { background-color: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary-blue); text-decoration: none; }
        .back-btn { background: var(--primary-blue); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; text-decoration: none; }
        
        .setup-box { background: var(--card-bg); margin: 20px; padding: 20px; border-radius: 15px; border: 2px solid var(--primary-blue); }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #CBD5E1; margin-bottom: 15px; }
        .btn-search { width: 100%; background-color: var(--highlight-orange); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        #result-container { margin: 20px; display: none; }
        .notes-card { background: var(--card-bg); padding: 20px; border-radius: 15px; border-top: 5px solid var(--primary-blue); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .story-content { background: #F8FAFC; padding: 20px; border-radius: 10px; font-size: 16px; line-height: 1.8; text-align: justify; white-space: pre-wrap; border: 1px solid #E2E8F0; margin-bottom: 20px; }
        
        /* 🚀 2. नोट्स का बड़ा जादुई स्पीकर बटन 🚀 */
        .btn-speaker { display: block; width: 100%; text-align: center; background-color: #10B981; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 0 #059669; transition: 0.1s; }
        .btn-speaker:active { transform: translateY(4px); box-shadow: 0 0 0 #059669; }
        
        .btn-pdf { display: block; width: 100%; text-align: center; background-color: #EF4444; color: white; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <header><a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Sonu Classes</a><a href="index.html" class="back-btn">Home</a></header>

    <div class="setup-box">
        <label>विषय (Subject):</label>
        <select id="subject-select"><option value="hindi">हिंदी (Hindi)</option><option value="science">विज्ञान (Science)</option></select>
        <label>पाठ (Lesson):</label>
        <select id="lesson-select"><option value="lesson1">Lesson 1</option><option value="lesson2">Lesson 2</option></select>
        <button class="btn-search" onclick="fetchNotes()">पाठ पढ़ें</button>
    </div>

    <div id="result-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDCzAhpQonWiNDtWmyox5QdPd4xRbpOy30", authDomain: "sonuclasses-b19db.firebaseapp.com", databaseURL: "https://sonuclasses-b19db-default-rtdb.firebaseio.com", projectId: "sonuclasses-b19db", storageBucket: "sonuclasses-b19db.firebasestorage.app", messagingSenderId: "166740602272", appId: "1:166740602272:web:af9131ad8c5e4c8fca08c5" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);

        // 🚀 बिना रुके बोलने वाला स्मूथ स्पीकर फंक्शन (Notes के लिए) 🚀
        window.speakNotesSmoothly = (btnElement) => {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                btnElement.innerHTML = '<i class="fa-solid fa-volume-high"></i> पूरी कहानी बोलकर सुनाएँ';
                btnElement.style.backgroundColor = '#10B981';
                btnElement.style.boxShadow = '0 4px 0 #059669';
                return;
            }
            
            btnElement.innerHTML = '<i class="fa-solid fa-circle-stop"></i> कहानी रोकें';
            btnElement.style.backgroundColor = '#EF4444';
            btnElement.style.boxShadow = '0 4px 0 #B91C1C';

            // स्क्रीन पर जो कहानी लिखी है, उसे उठाओ
            let text = document.getElementById('story-text-box').innerText;
            let cleanText = text.replace(/[*#_]/g, '');
            let chunks = cleanText.match(/[^.!?।]+[.!?।]+/g) || [cleanText];
            let i = 0;

            function speakNextChunk() {
                if (i < chunks.length) {
                    let speech = new SpeechSynthesisUtterance(chunks[i]);
                    speech.lang = 'hi-IN'; speech.rate = 0.85; 
                    speech.onend = speakNextChunk;
                    window.speechSynthesis.speak(speech);
                    i++;
                } else {
                    btnElement.innerHTML = '<i class="fa-solid fa-volume-high"></i> पूरी कहानी बोलकर सुनाएँ';
                    btnElement.style.backgroundColor = '#10B981';
                    btnElement.style.boxShadow = '0 4px 0 #059669';
                }
            }
            speakNextChunk();
        };

        window.fetchNotes = async () => {
            const subject = document.getElementById('subject-select').value;
            const lesson = document.getElementById('lesson-select').value;
            const resultContainer = document.getElementById('result-container');
            
            resultContainer.innerHTML = "<h3 style='text-align:center;'>खोज रहा हूँ... ⏳</h3>"; resultContainer.style.display = 'block';

            try {
                const snapshot = await get(child(ref(db), `appData/notes/class10/${subject}/${lesson}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let htmlContent = `<div class="notes-card">`;
                    
                    if(data.text && data.text.trim() !== "") {
                        // 🚀 कहानी के ठीक नीचे स्पीकर बटन जोड़ा गया 🚀
                        htmlContent += `<h3 style="color: var(--primary-blue);"><i class="fa-solid fa-book-open"></i> पाठ का सारांश</h3>
                                        <div class="story-content" id="story-text-box">${data.text}</div>
                                        <button class="btn-speaker" onclick="speakNotesSmoothly(this)"><i class="fa-solid fa-volume-high"></i> पूरी कहानी बोलकर सुनाएँ</button>`;
                    }
                    if(data.pdf && data.pdf.trim() !== "") {
                        htmlContent += `<a href="${data.pdf}" target="_blank" class="btn-pdf"><i class="fa-solid fa-file-pdf"></i> PDF डाउनलोड करें</a>`;
                    }
                    htmlContent += `</div>`;
                    resultContainer.innerHTML = htmlContent;
                } else {
                    resultContainer.innerHTML = `<h3 style='text-align:center; color:red;'>❌ नोट्स नहीं मिले!</h3>`;
                }
            } catch (error) { resultContainer.innerHTML = "❌ एरर!"; }
        };
    </script>
</body>
</html>
