<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu Classes - Online Test</title>
    <style>
        :root { --primary-green: #2E7D32; --primary-blue: #1976D2; --bg-color: #f4f6f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; text-align: center; }
        
        .test-container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; text-align: left; }
        h2 { color: var(--primary-blue); text-align: center; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* 🌟 सिर्फ विषय चुनने वाला डब्बा 🌟 */
        .setup-box { background: #E3F2FD; padding: 20px; border-radius: 10px; border: 2px solid var(--primary-blue); text-align: center; margin-bottom: 20px; }
        .setup-box label { font-size: 18px; font-weight: bold; color: #333; display: block; margin-bottom: 10px; }
        .setup-box select { width: 100%; max-width: 300px; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 15px; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-start { background-color: #FF9800; }
        .btn-start:hover { background-color: #F57C00; }
        .btn-submit { background-color: var(--primary-green); margin-top: 20px; display: none; }
        
        /* क्विज़ का डिज़ाइन */
        #quiz-section { display: none; }
        .question-card { background: #fff8e1; border: 1px solid #FFE0B2; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .q-text { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
        .option-label { display: block; background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .option-label:hover { background: #f0f0f0; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
        
        /* टाइमर */
        .timer { font-size: 20px; font-weight: bold; color: #D32F2F; text-align: center; margin-bottom: 15px; padding: 10px; background: #FFEBEE; border-radius: 8px; border: 1px solid #FFCDD2; display: none; }
        
        /* रिजल्ट स्क्रीन */
        #result-section { display: none; text-align: center; padding: 20px; }
        .score-circle { width: 120px; height: 120px; background: var(--primary-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; margin: 0 auto 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="test-container">
    <h2>📝 सोनू ऑनलाइन टेस्ट</h2>

    <div id="setup-section" class="setup-box">
        <label>अपना विषय (Subject) चुनें:</label>
        <select id="subject-select">
            <option value="science">🔬 विज्ञान (Science)</option>
            <option value="sst">🌍 सामाजिक विज्ञान (SST)</option>
            <option value="math">📐 गणित (Math)</option>
            <option value="hindi">अ हिंदी (Hindi)</option>
            <option value="english">A अंग्रेज़ी (English)</option>
        </select>
        <button class="btn btn-start" onclick="startTest()">🚀 टेस्ट शुरू करें</button>
        <p style="color: gray; font-size: 13px; margin-top: 15px;">नोट: यह टेस्ट 10वीं बोर्ड परीक्षा के लिए है।</p>
    </div>

    <div id="timer-display" class="timer">⏱️ समय: 15:00</div>

    <div id="quiz-section">
        <div id="questions-container"></div>
        <button id="submit-btn" class="btn btn-submit" onclick="submitTest()">✅ टेस्ट जमा करें</button>
    </div>

    <div id="result-section">
        <h2 style="color: var(--primary-green);">🎉 टेस्ट पूरा हुआ!</h2>
        <p style="font-size: 18px; color: #555;">आपका स्कोर:</p>
        <div class="score-circle" id="final-score">0</div>
        <p style="color: #FF9800; font-weight: bold;">आपका नाम लीडरबोर्ड पर भेज दिया गया है! 🏆</p>
        <button class="btn btn-start" style="margin-top: 20px;" onclick="window.location.href='index.html'">🏠 होम पेज पर वापस जाएँ</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCzAhpQonWiNDtWmyox5QdPd4xRbpOy30",
        authDomain: "sonuclasses-b19db.firebaseapp.com",
        databaseURL: "https://sonuclasses-b19db-default-rtdb.firebaseio.com",
        projectId: "sonuclasses-b19db",
        storageBucket: "sonuclasses-b19db.firebasestorage.app",
        messagingSenderId: "166740602272",
        appId: "1:166740602272:web:af9131ad8c5e4c8fca08c5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let studentName = "Student";
    let studentId = "Unknown";
    let questionsData = [];
    let timeLeft = 900; // 15 मिनट (900 सेकंड)
    let timerInterval;

    // चेक करें कि बच्चा लॉगिन है या नहीं
    onAuthStateChanged(auth, (user) => {
        if (user) {
            studentName = user.displayName || user.email.split('@')[0];
            studentId = user.uid;
        } else {
            alert("⚠️ टेस्ट देने के लिए पहले लॉगिन करना होगा!");
            window.location.replace("login.html");
        }
    });

    // 🚀 टेस्ट शुरू करने का फंक्शन
    window.startTest = async () => {
        const subject = document.getElementById('subject-select').value;
        const dbRef = ref(db);
        
        // 🌟 बैकग्राउंड में क्लास 10 फिक्स है! 🌟
        const fetchPath = `appData/quizzes/class10/${subject}`;

        document.getElementById('setup-section').innerHTML = "<h3 style='color: var(--primary-blue);'>सवाल लोड हो रहे हैं... ⏳</h3>";

        try {
            const snapshot = await get(child(dbRef, fetchPath));
            if (snapshot.exists()) {
                questionsData = [];
                snapshot.forEach((childSnapshot) => {
                    questionsData.push({ id: childSnapshot.key, ...childSnapshot.val() });
                });

                renderQuestions();
                document.getElementById('setup-section').style.display = "none";
                document.getElementById('quiz-section').style.display = "block";
                document.getElementById('submit-btn').style.display = "block";
                document.getElementById('timer-display').style.display = "block";
                
                startTimer();
            } else {
                alert("❌ माफ़ करें! अभी इस विषय के सवाल सोनू सर ने अपलोड नहीं किए हैं।");
                window.location.reload();
            }
        } catch (error) {
            alert("❌ इंटरनेट कनेक्शन चेक करें: " + error);
            window.location.reload();
        }
    };

    // ⏱️ टाइमर चलाने का फंक्शन
    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("⏰ समय समाप्त! आपका टेस्ट अपने-आप जमा हो रहा है।");
                submitTest();
            } else {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer-display').innerText = `⏱️ समय: ${m}:${s < 10 ? '0'+s : s}`;
                timeLeft--;
            }
        }, 1000);
    }

    // 📝 सवाल दिखाने का फंक्शन
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = "";

        questionsData.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = "question-card";
            qDiv.innerHTML = `
                <div class="q-text">Q${index + 1}. ${q.question}</div>
                <label class="option-label"><input type="radio" name="ans_${index}" value="A"> A. ${q.options.A}</label>
                <label class="option-label"><input type="radio" name="ans_${index}" value="B"> B. ${q.options.B}</label>
                <label class="option-label"><input type="radio" name="ans_${index}" value="C"> C. ${q.options.C}</label>
                <label class="option-label"><input type="radio" name="ans_${index}" value="D"> D. ${q.options.D}</label>
            `;
            container.appendChild(qDiv);
        });
    }

    // ✅ टेस्ट जमा करने और स्कोर निकालने का फंक्शन
    window.submitTest = () => {
        clearInterval(timerInterval);
        let score = 0;

        questionsData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="ans_${index}"]:checked`);
            if (selected && selected.value === q.answer) {
                score += 10; // हर सही जवाब के 10 अंक
            }
        });

        document.getElementById('quiz-section').style.display = "none";
        document.getElementById('timer-display').style.display = "none";
        document.getElementById('result-section').style.display = "block";
        document.getElementById('final-score').innerText = score;

        saveScoreToLeaderboard(score);
    };

    // 🏆 स्कोर को लीडरबोर्ड (Firebase) पर भेजने का फंक्शन
    function saveScoreToLeaderboard(score) {
        const todayDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
        
        // 🌟 set() का इस्तेमाल किया गया है ताकि एक बच्चे का नाम सिर्फ एक बार आए! 🌟
        set(ref(db, `daily_leaderboard/${todayDate}/${studentId}`), {
            name: studentName,
            score: score
        }).then(() => {
            console.log("स्कोर सेव हो गया!");
        }).catch((error) => {
            console.log("स्कोर सेव करने में एरर: ", error);
        });
    }
</script>
</body>
</html>
