<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E40AF">
    <title>Sonu Classes - Gaming Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary-blue: #1E40AF; --highlight-orange: #F97316; --bg-dark: #0F172A; --card-bg: #FFFFFF; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: var(--primary-blue); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
        .logo { font-size: 20px; font-weight: 800; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--highlight-orange); }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; }

        .game-dashboard { display: flex; justify-content: space-between; padding: 15px 20px; background: #1E293B; border-bottom: 2px solid #334155; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: #94A3B8; font-weight: bold; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: white; }
        .score-text { color: #10B981; }
        .timer-text { color: #EF4444; }
        
        /* 🔥 स्ट्रीक (Streak) वाला डिज़ाइन */
        .streak-box { background: rgba(249, 115, 22, 0.2); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--highlight-orange); color: var(--highlight-orange); font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .streak-box.on-fire { background: var(--highlight-orange); color: white; box-shadow: 0 0 15px var(--highlight-orange); transform: scale(1.1); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .quiz-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .question-card { background: var(--card-bg); color: #0F172A; width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border-bottom: 6px solid var(--primary-blue); position: relative; z-index: 2; }
        .question-number { background: var(--primary-blue); color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .question-text { font-size: 20px; font-weight: 800; margin: 20px 0; line-height: 1.4; }

        .options-grid { display: grid; gap: 15px; width: 100%; max-width: 500px; margin-top: 20px; z-index: 2; }
        .option-btn { background: #1E293B; color: white; border: 2px solid #334155; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: left; display: flex; align-items: center; gap: 10px; }
        .option-btn:hover { border-color: var(--primary-blue); background: #283548; }
        
        /* 🎮 सही/गलत का गेमिंग एनीमेशन */
        .option-btn.correct { background: #10B981 !important; border-color: #059669 !important; color: white; animation: popIn 0.3s ease; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .option-btn.wrong { background: #EF4444 !important; border-color: #B91C1C !important; color: white; animation: shake 0.4s ease; }

        @keyframes popIn { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

        /* 🎖️ रिजल्ट स्क्रीन और बैज */
        .result-screen { display: none; flex-direction: column; align-items: center; justify-content: center; background: #1E293B; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; border: 2px solid var(--highlight-orange); z-index: 5; }
        .badge-icon { font-size: 60px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .badge-title { font-size: 24px; font-weight: 900; color: var(--highlight-orange); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .final-score { font-size: 40px; font-weight: 900; color: white; margin: 15px 0; }
        .btn-home { background: var(--primary-blue); color: white; padding: 12px 30px; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; margin-top: 20px; box-shadow: 0 4px 10px rgba(30, 64, 175, 0.5); }

        .loading-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 100; color: white; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">गेम लोड हो रहा है... ⏳</div>

<header>
    <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> Sonu Quiz Pro</a>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
</header>

<div class="game-dashboard" id="dashboard">
    <div class="stat-box">
        <div class="stat-label">Score</div>
        <div class="stat-value score-text" id="scoreDisplay">0</div>
    </div>
    <div class="streak-box" id="streakBox">
        <i class="fa-solid fa-fire"></i> <span id="streakCount">0</span> Streak
    </div>
    <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-value timer-text" id="timeDisplay">15s</div>
    </div>
</div>

<div class="quiz-container">
    <div class="question-card" id="questionCard">
        <div class="question-number">सवाल <span id="qNumber">1</span>/5</div>
        <div class="question-text" id="questionText">सोनू क्लासेज का सवाल लोड हो रहा है...</div>
    </div>

    <div class="options-grid" id="optionsGrid">
        </div>

    <div class="result-screen" id="resultScreen">
        <div class="badge-icon" id="badgeIcon">🏆</div>
        <div class="badge-title" id="badgeTitle">PRO PLAYER</div>
        <p style="color: #94A3B8; margin: 0;">आपका फाइनल गेमिंग स्कोर</p>
        <div class="final-score" id="finalScoreDisplay">0 / 50</div>
        <p id="saveMsg" style="color: #10B981; font-weight: bold; font-size: 14px;">✅ स्कोर लीडरबोर्ड में सेव हो गया!</p>
        <a href="test.html" class="btn-home" style="background:var(--highlight-orange); margin-bottom:10px;"><i class="fa-solid fa-rotate-right"></i> फिर से खेलें</a>
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> होम पेज पर जाएं</a>
    </div>
</div>

<script type="module">
  // 🔥 Firebase Configuration (आपके असली डेटाबेस के लिए)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyDCzAhpQonWiNDtWmyox5QdPd4xRbpOy30", authDomain: "sonuclasses-b19db.firebaseapp.com", databaseURL: "https://sonuclasses-b19db-default-rtdb.firebaseio.com", projectId: "sonuclasses-b19db", storageBucket: "sonuclasses-b19db.firebasestorage.app", messagingSenderId: "166740602272", appId: "1:166740602272:web:af9131ad8c5e4c8fca08c5" };
  const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getDatabase(app);

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
      if (user) { currentUser = user; document.getElementById('loadingScreen').style.display = 'none'; startGame(); } 
      else { window.location.replace("login.html"); }
  });

  // 📝 गेमिंग क्विज़ के सवाल (आप इन्हें बाद में बदल सकते हैं)
  const questions = [
      { q: "भारत का पहला नागरिक कौन होता है?", options: ["प्रधानमंत्री", "राष्ट्रपति", "मुख्य न्यायाधीश", "सोनू सर"], answer: 1 },
      { q: "प्रकाश संश्लेषण (Photosynthesis) में पौधे कौन सी गैस लेते हैं?", options: ["ऑक्सीजन", "नाइट्रोजन", "कार्बन डाइऑक्साइड", "हाइड्रोजन"], answer: 2 },
      { q: "बिहार की राजधानी कहाँ है?", options: ["गया", "पटना", "भागलपुर", "खगड़िया"], answer: 1 },
      { q: "कंप्यूटर का दिमाग किसे कहा जाता है?", options: ["Monitor", "Mouse", "CPU", "Keyboard"], answer: 2 },
      { q: "इनमें से कौन सा गेम सबसे ज़्यादा पॉपुलर है?", options: ["Mario", "Free Fire", "Ludo", "Snake"], answer: 1 }
  ];

  let currentQuestionIndex = 0;
  let score = 0;
  let streak = 0;
  let timeLeft = 15;
  let timerInterval;
  let canAnswer = true;

  // 🔊 गेमिंग वॉइस (AI स्पीकर)
  function speakSfx(text) {
      if(window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      let msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'hi-IN'; msg.rate = 1.2; window.speechSynthesis.speak(msg);
  }

  // 🎊 3D फायर / कंफेट्टी इफ़ेक्ट फंक्शन
  function fireConfetti() {
      var duration = 3 * 1000; var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
      function randomInRange(min, max) { return Math.random() * (max - min) + min; }
      var interval = setInterval(function() {
          var timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) { return clearInterval(interval); }
          var particleCount = 50 * (timeLeft / duration);
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
  }

  function startGame() {
      currentQuestionIndex = 0; score = 0; streak = 0; loadQuestion();
  }

  window.loadQuestion = () => {
      canAnswer = true;
      clearInterval(timerInterval);
      timeLeft = 15;
      document.getElementById('timeDisplay').innerText = timeLeft + "s";
      document.getElementById('timeDisplay').style.color = "#EF4444";

      const currentQ = questions[currentQuestionIndex];
      document.getElementById('qNumber').innerText = currentQuestionIndex + 1;
      document.getElementById('questionText').innerText = currentQ.q;
      
      const optionsGrid = document.getElementById('optionsGrid');
      optionsGrid.innerHTML = '';
      
      const labels = ['A', 'B', 'C', 'D'];
      currentQ.options.forEach((opt, index) => {
          const btn = document.createElement('div');
          btn.className = 'option-btn';
          btn.innerHTML = `<span style="background:rgba(255,255,255,0.1); padding:5px 10px; border-radius:8px; margin-right:5px;">${labels[index]}</span> ${opt}`;
          btn.onclick = () => checkAnswer(index, btn);
          optionsGrid.appendChild(btn);
      });

      // ⏱️ टाइमर शुरू
      timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('timeDisplay').innerText = timeLeft + "s";
          if(timeLeft <= 5) document.getElementById('timeDisplay').style.color = "red";
          if (timeLeft <= 0) {
              clearInterval(timerInterval);
              checkAnswer(-1, null); // टाइम आउट होने पर गलत मान लिया जाएगा
          }
      }, 1000);
  }

  window.checkAnswer = (selectedIndex, btnElement) => {
      if (!canAnswer) return;
      canAnswer = false;
      clearInterval(timerInterval);

      const correctIndex = questions[currentQuestionIndex].answer;
      const allBtns = document.getElementById('optionsGrid').children;

      if (selectedIndex === correctIndex) {
          // ✅ सही जवाब
          if(btnElement) btnElement.classList.add('correct');
          score += 10;
          streak++;
          document.getElementById('scoreDisplay').innerText = score;
          document.getElementById('streakCount').innerText = streak;
          
          // 🔥 3 स्ट्रीक वाला गेमिंग जादू (ON FIRE)
          if(streak === 3) {
              document.getElementById('streakBox').classList.add('on-fire');
              fireConfetti();
              speakSfx("ऑन फायर! शानदार प्रदर्शन!");
              score += 5; // बोनस पॉइंट
              document.getElementById('scoreDisplay').innerText = score;
          } else if(streak > 3) {
              fireConfetti();
          }

      } else {
          // ❌ गलत जवाब
          if(btnElement) btnElement.classList.add('wrong');
          streak = 0; // स्ट्रीक टूट गई
          document.getElementById('streakCount').innerText = streak;
          document.getElementById('streakBox').classList.remove('on-fire');
          
          // सही जवाब दिखाओ
          allBtns[correctIndex].classList.add('correct');
      }

      // 1.5 सेकंड बाद अगला सवाल
      setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questions.length) {
              loadQuestion();
          } else {
              endGame();
          }
      }, 1500);
  }

  window.endGame = () => {
      document.getElementById('questionCard').style.display = 'none';
      document.getElementById('optionsGrid').style.display = 'none';
      document.getElementById('dashboard').style.display = 'none';
      
      const resultScreen = document.getElementById('resultScreen');
      resultScreen.style.display = 'flex';
      
      document.getElementById('finalScoreDisplay').innerText = score + " / " + (questions.length * 10 + 5);

      // 🎖️ गेमिंग बैज सिस्टम
      let badge = ""; let title = ""; let speech = "";
      if (score >= 45) { badge = "👑"; title = "GRANDMASTER (Toper)"; speech = "ग्रैंडमास्टर! आप टॉपर हैं!"; fireConfetti(); }
      else if (score >= 30) { badge = "💎"; title = "HEROIC (Pro Player)"; speech = "हीरोइक! बहुत बढ़िया खेले!"; }
      else if (score >= 15) { badge = "🛡️"; title = "PLATINUM (Challenger)"; speech = "प्लेटिनम! थोड़ी और मेहनत करो।"; }
      else { badge = "🥉"; title = "BRONZE (Noob)"; speech = "ब्रोंज़! आपको और पढ़ाई करनी होगी।"; }

      document.getElementById('badgeIcon').innerText = badge;
      document.getElementById('badgeTitle').innerText = title;
      speakSfx(speech);

      // 🏆 स्कोर Firebase लीडरबोर्ड में सेव करना
      if(currentUser) {
          const td = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
          const userRef = ref(db, `daily_leaderboard/${td}/${currentUser.uid}`);
          set(userRef, { name: currentUser.displayName || "Student", score: score }).then(()=>{
              console.log("Score Saved");
          }).catch(()=>{
              document.getElementById('saveMsg').innerText = "❌ स्कोर सेव नहीं हो पाया!";
              document.getElementById('saveMsg').style.color = "red";
          });
      }
  }
</script>
</body>
</html>
