<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu Classes - Live Test Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .app-container { max-width: 500px; margin: 20px auto; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 20px; overflow: hidden; }
        h2 { color: #1a73e8; text-align: center; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; color: #333; margin-bottom: 5px; display: block; }
        select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background-color: #f9f9f9; }
        
        .btn { width: 100%; padding: 14px; background-color: #ff5722; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(255, 87, 34, 0.3); transition: 0.3s; }
        .btn:hover { background-color: #e64a19; }
        .btn-blue { background-color: #1a73e8; box-shadow: 0 4px 6px rgba(26, 115, 232, 0.3); }
        .btn-blue:hover { background-color: #1557b0; }

        .rules-box { background-color: #e8f0fe; padding: 15px; border-radius: 8px; border-left: 5px solid #1a73e8; margin-bottom: 20px; }
        .rules-box ul { padding-left: 20px; line-height: 1.8; color: #333; }
        
        .timer-box { font-size: 22px; font-weight: bold; color: #d32f2f; text-align: center; margin-bottom: 15px; background: #ffebee; padding: 10px; border-radius: 30px; }
        .question-text { font-size: 18px; font-weight: bold; color: #222; margin-bottom: 20px; }
        .option-btn { width: 100%; padding: 12px; margin-bottom: 10px; background-color: white; border: 2px solid #1a73e8; color: #1a73e8; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; }
        .option-btn:hover, .option-btn.selected { background-color: #1a73e8; color: white; }

        .result-box { text-align: center; padding: 20px; }
        .score-text { font-size: 40px; font-weight: bold; color: #4caf50; margin: 10px 0; }
        
        #rules-screen, #quiz-screen, #result-screen { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="selection-screen">
        <h2>📚 Sonu Classes Test</h2>
        
        <div class="form-group">
            <label>क्लास चुनें:</label>
            <select id="sel-class">
                <option value="class6">Class 6</option>
                <option value="class7">Class 7</option>
                <option value="class8">Class 8</option>
                <option value="class9">Class 9</option>
                <option value="class10">Class 10</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>विषय चुनें:</label>
            <select id="sel-subject">
                <option value="hindi">Hindi</option>
                <option value="math">Math</option>
                <option value="science">Science</option>
                <option value="sst">SST</option>
                <option value="english">English</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>चैप्टर चुनें:</label>
            <select id="sel-lesson">
                <option value="lesson1">Lesson 1</option>
                <option value="lesson2">Lesson 2</option>
                <option value="lesson3">Lesson 3</option>
                <option value="lesson4">Lesson 4</option>
                <option value="lesson5">Lesson 5</option>
                <option value="lesson6">Lesson 6</option>
            </select>
        </div>
        
        <button class="btn" onclick="showRules()">📝 ऑनलाइन टेस्ट दें</button>
        <button class="btn" style="background-color: #555; margin-top: 10px;" onclick="window.location.href='index.html'">🏠 होम पेज पर वापस जाएँ</button>
    </div>

    <div id="rules-screen">
        <h2>⚠️ टेस्ट के नियम</h2>
        <div class="rules-box">
            <ul>
                <li>✅ <b>सही जवाब:</b> <b>+10 नंबर</b></li>
                <li>❌ <b>गलत जवाब:</b> <b>-5 नंबर</b></li>
                <li>⏱️ <b>समय:</b> <b>30 सेकंड</b> प्रति सवाल</li>
                <li>🏆 <b>लीडरबोर्ड:</b> टेस्ट के बाद अपना नाम सेव करें!</li>
            </ul>
        </div>
        <button class="btn btn-blue" onclick="startTest()">🚀 टेस्ट शुरू करें</button>
    </div>

    <div id="quiz-screen">
        <div class="timer-box">⏱️ समय: <span id="time-left">30</span> सेकंड</div>
        <div class="question-text" id="question-text">सवाल लोड हो रहा है...</div>
        
        <div id="options-container">
            <button class="option-btn" onclick="selectOption('A')" id="optA">A</button>
            <button class="option-btn" onclick="selectOption('B')" id="optB">B</button>
            <button class="option-btn" onclick="selectOption('C')" id="optC">C</button>
            <button class="option-btn" onclick="selectOption('D')" id="optD">D</button>
        </div>
        
        <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">Next / अगला सवाल ⏭️</button>
    </div>

    <div id="result-screen">
        <h2>🏆 टेस्ट पूरा हुआ!</h2>
        <div class="result-box">
            <p>आपका स्कोर है:</p>
            <div class="score-text" id="final-score">0</div>
            <p id="feedback-msg" style="font-weight: bold;"></p>
            
            <div style="margin-top: 20px; padding: 15px; background: #e8f0fe; border-radius: 10px;">
                <p style="margin-top:0; font-weight:bold; color:#1976D2;">🏆 लीडरबोर्ड में नाम दर्ज करें</p>
                <input type="text" id="student-name-input" placeholder="अपना नाम लिखें..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; text-align:center; box-sizing: border-box; font-size: 16px;">
                <button class="btn btn-blue" onclick="saveMyScore()" style="margin-top: 10px; background-color: #E65100;">सेव करें 🚀</button>
            </div>
            
            <button class="btn" style="background-color: #2E7D32; margin-top: 15px;" onclick="window.location.href='index.html'">🏠 होम पेज पर जाएँ</button>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // 🌟 push जोड़ा गया है ताकि डेटाबेस में नया स्कोर सेव हो सके
    import { getDatabase, ref, get, child, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCzAhpQonWiNDtWmyox5QdPd4xRbpOy30",
        authDomain: "sonuclasses-b19db.firebaseapp.com",
        databaseURL: "https://sonuclasses-b19db-default-rtdb.firebaseio.com",
        projectId: "sonuclasses-b19db",
        storageBucket: "sonuclasses-b19db.firebasestorage.app",
        messagingSenderId: "166740602272",
        appId: "1:166740602272:web:af9131ad8c5e4c8fca08c5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 30;
    let selectedAnswer = "";

    window.showRules = () => {
        document.getElementById('selection-screen').style.display = 'none';
        document.getElementById('rules-screen').style.display = 'block';
    };

    window.startTest = async () => {
        const cls = document.getElementById('sel-class').value;
        const sub = document.getElementById('sel-subject').value;
        const les = document.getElementById('sel-lesson').value;

        document.getElementById('rules-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('question-text').innerText = "सवाल ढूँढ रहा हूँ... 🔄";

        const dbRef = ref(db);
        try {
            const snapshot = await get(child(dbRef, `appData/quizzes/${cls}/${sub}/${les}`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                if(data.question && !data.options) {
                    alert("⚠️ बॉस! इस चैप्टर में पुराने डिज़ाइन वाला सवाल फँसा है। कृपया पैनल से 'Lesson 2' में नया सवाल डालकर टेस्ट करें!");
                    location.reload();
                    return;
                }

                allQuestions = Object.values(data); 
                loadQuestion();
            } else {
                alert("⚠️ सोनू सर ने अभी इस चैप्टर में कोई सवाल नहीं डाला है!");
                location.reload();
            }
        } catch (error) {
            alert("❌ एरर: " + error);
        }
    };

    window.loadQuestion = () => {
        if(currentQIndex >= allQuestions.length) {
            showResult(); 
            return;
        }

        selectedAnswer = "";
        timeLeft = 30;
        document.getElementById('time-left').innerText = timeLeft;
        document.getElementById('next-btn').style.display = 'none';
        
        ['A', 'B', 'C', 'D'].forEach(opt => {
            const btn = document.getElementById('opt' + opt);
            btn.style.backgroundColor = 'white';
            btn.style.color = '#1a73e8';
            btn.disabled = false; 
        });

        const currentQ = allQuestions[currentQIndex];
        
        if(!currentQ.options) {
            currentQIndex++;
            loadQuestion();
            return;
        }

        document.getElementById('question-text').innerText = `Q${currentQIndex + 1}: ${currentQ.question}`;
        document.getElementById('optA').innerText = `A. ${currentQ.options.A}`;
        document.getElementById('optB').innerText = `B. ${currentQ.options.B}`;
        document.getElementById('optC').innerText = `C. ${currentQ.options.C}`;
        document.getElementById('optD').innerText = `D. ${currentQ.options.D}`;

        startTimer();
    };

    window.selectOption = (opt) => {
        selectedAnswer = opt;
        ['A', 'B', 'C', 'D'].forEach(o => {
            const btn = document.getElementById('opt' + o);
            btn.disabled = true; 
            if(o === opt) {
                btn.style.backgroundColor = '#1a73e8';
                btn.style.color = 'white';
            }
        });
        document.getElementById('next-btn').style.display = 'block'; 
    };

    window.nextQuestion = () => {
        clearInterval(timerInterval); 
        const correctAns = allQuestions[currentQIndex].answer;
        if(selectedAnswer === correctAns) score += 10;
        else if (selectedAnswer !== "") score -= 5;  
        
        currentQIndex++;
        loadQuestion();
    };

    window.startTimer = () => {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('time-left').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                nextQuestion(); 
            }
        }, 1000);
    };

    window.showResult = () => {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-score').style.color = score > 0 ? "#4caf50" : "#d32f2f";
        document.getElementById('feedback-msg').innerText = score > 0 ? "शाबाश! 🎉" : "और मेहनत करो! 💪";
    };

    // 🌟 असली जादू: आज की तारीख के साथ स्कोर सेव करना 🌟
    window.saveMyScore = () => {
        const name = document.getElementById('student-name-input').value;
        if (!name) {
            alert("⚠️ बॉस, पहले अपना नाम तो लिखिए!");
            return;
        }

        const today = new Date().toISOString().split('T')[0];
        const scoreRef = ref(db, `daily_leaderboard/${today}`);
        
        push(scoreRef, {
            name: name,
            score: score
        }).then(() => {
            alert("🎉 आपका स्कोर आज के लीडरबोर्ड में सेव हो गया!");
            window.location.href = 'index.html'; // सेव होते ही होम पेज पर भेज दो
        }).catch((error) => {
            alert("❌ एरर: " + error);
        });
    };
</script>
</body>
</html>
